[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnloop"
version = "0.1.11"
description = "A local-first agentic coding harness: streaming tool loop, permission gating, context compaction, subagents, and any LLM provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranesh" }]
keywords = ["agent", "llm", "cli", "coding-agent", "harness", "tool-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "textual>=0.80",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # Already pulled in transitively by httpx, but the loop, subprocess handling and
  # cancellation all use it directly, so it is declared.
  "anyio>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-textual-snapshot>=1.0",
  # Pinned to a minor range, not floated. Ruff adds lint rules in minor releases,
  # so `>=0.6` means a build that is green today goes red tomorrow with no commit
  # in between — which is how this CI first broke. Bump deliberately.
  "ruff>=0.16.1,<0.17",
  # Must match what is actually run locally, or CI type-checks with a different
  # tool than the author does — which is exactly how this broke.
  "mypy>=2.1,<3",
]

[project.scripts]
turnloop = "turnloop.cli:main"
tl = "turnloop.cli:main"

[project.urls]
Homepage = "https://github.com/Pranesh-2005/turnloop"

[tool.hatch.build.targets.wheel]
packages = ["turnloop"]

# Without an explicit include, the sdist sweeps up whatever happens to be sitting
# in the working tree. A stray `git clone` left behind by a failed skill install
# put 157 of 317 entries — 4.2 MB of an unrelated repository — into the 0.1.8
# sdist before this was pinned down. An allowlist fails closed: new junk is not
# published, and a genuinely new top-level path has to be added here on purpose.
[tool.hatch.build.targets.sdist]
include = ["turnloop", "tests", "README.md", "pyproject.toml", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC", "RUF"]
ignore = [
  "E501",   # line length is the formatter's business
  "B008",   # pydantic Field() in defaults is the intended idiom
  "RUF012", # Textual's BINDINGS/CSS_PATH are plain class lists by API contract
  "RUF001", # ambiguous glyphs (›, ⏵, ⤺) are deliberate UI characters
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
# Task fixtures are deliberately broken Python — they are inputs, not code.
exclude = "turnloop/experiments/suite/fixtures/"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits a real network endpoint; deselected by default",
  "slow: takes more than a few seconds",
]
addopts = "-m 'not live' -q"
